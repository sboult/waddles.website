name: Clean up PR preview

on:
  pull_request_target:
    types:
      - closed

concurrency:
  group: waddles-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/waddles-github-preview-publish
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Remove preview
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          aws s3 rm
          "s3://waddles-website-previews-${AWS_ACCOUNT_ID}/pr-${PR_NUMBER}"
          --recursive
