name: Deploy DNS

on:
  workflow_dispatch:

concurrency:
  group: waddles-dns-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: dns-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure
        run: pnpm --filter @waddles/infra build

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/waddles-github-dns-deployment
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Deploy DomainStack
        working-directory: infra
        run: >-
          pnpm exec cdk deploy WaddlesDomainStack
          --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/waddles-cloudformation-dns-execution
          --require-approval never

