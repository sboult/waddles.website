applications:
  - appRoot: apps/www
    customHeaders:
      - pattern: "**/*"
        headers:
          - key: Content-Security-Policy
            value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains; preload
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
